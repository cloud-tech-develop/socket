<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Client 2</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="max-w-xl mx-auto mt-8 p-4 bg-gray-100 rounded shadow">
      <input
        type="text"
        id="messageInput"
        placeholder="Escribe tu mensaje..."
        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
      />
      <button
        onclick="sendMessage()"
        class="mt-2 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 focus:outline-none focus:shadow-outline-blue"
      >
        Enviar
      </button>

      <ul id="messageList" class="mt-4 space-y-4"></ul>
    </div>

    <script>
      const idUser = 2;
      const room = "strategy-rom";
      const serverUrl = `ws://${window.location.host}/ws?id=${idUser}&room=${room}`;
      const socket = new WebSocket(serverUrl);

      socket.addEventListener("open", (event) => {
        console.log("Conexión establecida con el servidor WebSocket");
      });

      socket.addEventListener("message", (event) => {
        const message = JSON.parse(event.data);
        console.log("Mensaje recibido del servidor:", message);

        // Agrega el mensaje a la lista de mensajes
        appendMessageToList(message);
      });

      socket.addEventListener("close", (event) => {
        console.log("Conexión cerrada con el servidor WebSocket");
      });

      socket.addEventListener("error", (event) => {
        console.error("Error en la conexión WebSocket:", event);
      });

      function sendMessage() {
        const messageInput = document.getElementById("messageInput");
        const messageContent = messageInput.value.trim();

        if (messageContent !== "") {
          let content = messageContent;
          // Intenta parsear como JSON si parece un objeto o array
          if (
            (messageContent.startsWith("{") && messageContent.endsWith("}")) ||
            (messageContent.startsWith("[") && messageContent.endsWith("]"))
          ) {
            try {
              content = JSON.parse(messageContent);
            } catch (e) {
              // Si falla el parseo, lo envía como texto
              content = messageContent;
            }
          }

          const message = {
            sender: idUser,
            content: content,
          };

          socket.send(JSON.stringify(message));
          messageInput.value = "";
        }
      }

      function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        const hours = String(date.getHours()).padStart(2, "0");
        const minutes = String(date.getMinutes()).padStart(2, "0");
        const seconds = String(date.getSeconds()).padStart(2, "0");

        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
      }

      function appendMessageToList(message) {
        const messageList = document.getElementById("messageList");
        const listItem = document.createElement("li");

        // Formatea la fecha y hora del mensaje
        const formattedDateTime = formatDate(new Date(message.dateTime));

        let displayContent = message.content;
        if (typeof message.content === "object" && message.content !== null) {
          displayContent = `<pre class="bg-black text-green-400 p-2 rounded mt-2 text-xs overflow-x-auto">${JSON.stringify(
            message.content,
            null,
            2
          )}</pre>`;
        }

        listItem.innerHTML = `<li class="${
          message.sender == idUser ? "bg-green-300" : "bg-gray-200"
        } p-4 rounded flex flex-col">
               <div class="flex justify-between items-start">
                 <span class="inline-flex"><strong>User${
                   message.sender
                 }:&nbsp;</strong></span>
                 <span class="text-gray-500 text-sm">${formattedDateTime}</span>
               </div>
               <div class="mt-1">${
                 typeof message.content === "object"
                   ? displayContent
                   : message.content
               }</div>
            </li>`;
        messageList.appendChild(listItem);
      }
    </script>
  </body>
</html>
